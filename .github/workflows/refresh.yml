name: refresh

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"
          cache: pip

      - run: python -m pip install -e ".[dev]"

      - name: Re-measure every entry
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/refresh.py
          python scripts/render.py

      - name: Validate the re-measured data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/validate_data.py
          python scripts/render.py --check

      - name: Open the update pull request
        uses: peter-evans/create-pull-request@271a8d0340265f705b14b6d32b9829c1cb33d45e # v7.0.8
        with:
          branch: refresh/weekly
          title: "chore: weekly re-measure"
          body-path: refresh-report.md
          commit-message: "chore: weekly re-measure"
          delete-branch: true
          add-paths: |
            data/repos
            README.md

      - name: Open a policy drift issue
        if: hashFiles('refresh-report.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if grep -Fqx "No policy drift." refresh-report.md; then
            echo "nothing to report"; exit 0
          fi
          open=$(gh issue list --label policy-drift --state open --json number --jq 'length')
          if [ "$open" != "0" ]; then
            echo "a drift issue is already open"; exit 0
          fi
          gh issue create \
            --title "Policy text changed since the quoted commit" \
            --label policy-drift \
            --body-file refresh-report.md

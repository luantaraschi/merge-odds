name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"
          cache: pip

      - run: python -m pip install -e ".[dev]"

      - name: Unit tests
        run: python -m pytest -q

      - name: Changed entries
        id: changed
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          zero="0000000000000000000000000000000000000000"
          if [ -z "$base" ] || [ "$base" = "$zero" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            # No usable base to diff against (branch creation, a force-push
            # that rewrote history, ...). Falling back to validating every
            # entry is the safe direction: more checking, never less. Guard
            # the directory explicitly: git does not track empty
            # directories, so a fresh checkout before the first entry is
            # ever added would otherwise make `find` fail and abort the step.
            if [ -d data/repos ]; then
              files=$(find data/repos -maxdepth 1 -name '*.json' -type f | sort | tr '\n' ' ')
            else
              files=
            fi
          else
            files=$(git diff --name-only --diff-filter=d "$base" HEAD -- 'data/repos/*.json' | tr '\n' ' ')
          fi
          echo "files=$files" >> "$GITHUB_OUTPUT"

      - name: Validate changed entries
        if: steps.changed.outputs.files != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: python scripts/validate_data.py $CHANGED_FILES

      - name: README table in sync
        run: python scripts/render.py --check

[project]
name = "merge-odds"
version = "0.1.0"
description = "Does this project accept outside contributions, and under what rules?"
requires-python = ">=3.11"
dependencies = ["requests>=2.31", "jsonschema>=4.21"]

[project.urls]
Homepage = "https://luantaraschi.github.io/merge-odds/"
Repository = "https://github.com/luantaraschi/merge-odds"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
